<html lang="en">
<head>

            width: 100%;
        }

        [data-format="portrait"] iframe {
            display: block;
            width: 100%;
            max-width: 360px;
            max-height: 85dvh; /* Évite qu'un Short dépasse verticalement sur petit écran */
            aspect-ratio: 9 / 16;
            height: auto;
            margin-inline: auto;
            border: 0;
            border-radius: 12px;
            background-color: #000;
        }
    </style>
</head>
<body>
