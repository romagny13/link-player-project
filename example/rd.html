    class UrlInfo {
        #kind;
        #videoId;
        #videoIds;
        #playlistId;
        #startSeconds;
        #index;
        #autoplay;
        #mute;

        constructor({
                        kind,

    class UrlInfoHelper {
        static isValidVideoId(id) {
            return typeof id === 'string' && /^[a-zA-Z0-9_-]{11}$/.test(id);
        }

        static timeToSeconds(v) {
            if (v == null || v === '') return null;
            if (/^\d+$/.test(v)) return parseInt(v, 10);

            const m = String(v).match(/^(?:(\d+)h)?(?:(\d+)m)?(?:(\d+)s)?$/i);
            if (!m || (!m[1] && !m[2] && !m[3])) return null;

            return (+m[1] || 0) * 3600 + (+m[2] || 0) * 60 + (+m[3] || 0);
        }

        static toInt(v) {
            if (v == null || v === '') return null;
            const n = parseInt(v, 10);
            return Number.isNaN(n) ? null : n;
        }

        static toBool01(v) {
            if (v === '1' || v === 1 || v === true) return true;
            if (v === '0' || v === 0 || v === false) return false;
            return null;
        }
    }

    class YouTubeUrl {
        resolveFromUrl(url) {
            const u = this.#getValidUrl(url);
            if (!u) throw new Error("Invalid URL");

            let host = u.hostname.toLowerCase();
            if (host.startsWith('www.')) host = host.slice(4);

            const path = u.pathname.replace(/\/+$/, '') || '/';
            const p = u.searchParams;

            // ---------- youtu.be ----------
            if (host === 'youtu.be') {
                const videoId = path.slice(1);

                if (!UrlInfoHelper.isValidVideoId(videoId)) {
                    throw new Error("Invalid video ID");
                }

                const playlistId = p.get('list') || null;
                const startSeconds = UrlInfoHelper.timeToSeconds(p.get('t'));

                return new UrlInfo({
                    kind: playlistId ? 'playlist' : 'video',
                    videoId,
                    playlistId,
                    startSeconds
                });
            }

            // ---------- youtube.com family ----------
            if (host.endsWith('youtube.com')) {

                // /watch
                if (path === '/watch') {
                    const videoId = p.get('v');
                    const playlistId = p.get('list') || null;
                    const index = UrlInfoHelper.toInt(p.get('index'));
                    const startSeconds = UrlInfoHelper.timeToSeconds(p.get('t'));

                    if (videoId && !UrlInfoHelper.isValidVideoId(videoId)) {
                        throw new Error("Invalid video ID");
                    }

                    if (playlistId) {
                        return new UrlInfo({
                            kind: 'playlist',
                            videoId: videoId || null,
                            playlistId,
                            startSeconds,
                            index
                        });
                    }

                    if (videoId) {
                        return new UrlInfo({
                            kind: 'video',
                            videoId,
                            startSeconds
                        });
                    }

                    throw new Error("Missing video ID or playlist");
                }

                // /watch_videos
                if (path === '/watch_videos') {
                    const raw = p.get('video_ids');
                    if (!raw) throw new Error("Missing video_ids");

                    const videoIds = raw.split(',')
                        .map(id => id.trim())
                        .filter(id => UrlInfoHelper.isValidVideoId(id));

                    if (videoIds.length === 0) {
                        throw new Error("No valid video IDs");
                    }

                    const index = UrlInfoHelper.toInt(p.get('index'));

                    return new UrlInfo({
                        kind: 'videoList',
                        videoIds,
                        videoId: videoIds[0],
                        index
                    });
                }
            }

            throw new Error("Unsupported YouTube URL");
        }

        resolveFromSrc(src) {
            const u = this.#getValidUrl(src);          // ← corrigé
            if (!u) throw new Error("Invalid URL");

            let host = u.hostname.toLowerCase();
            if (host.startsWith('www.')) host = host.slice(4);

            if (!host.endsWith('youtube.com') && host !== 'youtube-nocookie.com') {
                throw new Error("Invalid embed host");
            }

            const path = u.pathname.replace(/\/+$/, '');
            if (!path.startsWith('/embed')) {
                throw new Error("Invalid embed URL");
            }

            const p = u.searchParams;
            const segments = path.split('/').filter(Boolean); // ["embed", "xxx"]
            const seg = segments[1] || null;

            const videoId = (seg && seg !== 'videoseries' && UrlInfoHelper.isValidVideoId(seg))
                ? seg
                : null;

            const playlistId = p.get('list') || null;
            const rawPlaylist = p.get('playlist'); // video list for embeds
            const videoIds = rawPlaylist
                ? rawPlaylist.split(',').map(id => id.trim()).filter(id => UrlInfoHelper.isValidVideoId(id))
                : null;

            const startSeconds = UrlInfoHelper.toInt(p.get('start'));
            const index = UrlInfoHelper.toInt(p.get('index'));
            const autoplay = UrlInfoHelper.toBool01(p.get('autoplay'));
            const mute = UrlInfoHelper.toBool01(p.get('mute'));

            let kind = null;
            if (playlistId) kind = 'playlist';
            else if (videoIds && videoIds.length) kind = 'videoList';
            else if (videoId) kind = 'video';
            else throw new Error("Invalid embed URL");

            return new UrlInfo({
                kind,
                videoId,
                videoIds,
                playlistId,
                startSeconds,
                index,
                autoplay,
                mute
            });
        }

        #getValidUrl(url) {
            try {
                return new URL(String(url).trim());
            } catch {
                return null;
            }
        }
    }

    class RegionHost {
        #root;
        #links = new Map();      // href → element
        #targets = new Set();    // target ids
        #frames = new Set();     // iframe elements
        #defaultTarget = null;

        constructor(defaultTarget) {
            if (defaultTarget) {
                this.setDefaultTarget(defaultTarget);
            }
        }

        get links() {
            return Object.freeze([...this.#links.values()]);
        }

        get targets() {
            return Object.freeze([...this.#targets]);
        }

        get frames() {
            return Object.freeze([...this.#frames]);
        }

        get defaultTarget() {
            return this.#defaultTarget;
        }

        Initialize(root = document) {
            this.#root = root;
        }

        setDefaultTarget(target) {
            if (!target) return;
            this.#defaultTarget = target;
            this.#targets.add(target);
        }

        discoverLinks() {
            const elements = this.getLinks();
            const newLinks = [];

            for (const el of elements) {
                const href = el.tagName === "A" ? el.href : el.dataset.url;

                if (!href || this.#links.has(href)) continue;

                if (el.dataset.target)
                    this.#targets.add(el.dataset.target);

                this.#links.set(href, el);
                newLinks.push(el);
            }

            return newLinks;
        }

        getLinks() {
            const elements = this.#root.querySelectorAll("[data-link]");
            return elements;
        }

        discoverTargets() {
           const newTargets = [];
            for (const link of this.#links) {
                const target = link.dataset.target?.trim();
                if (!target) continue;


                this.#targets.add(target);
                newTargets.push(target);
            }
            return newTargets;
        }

        discoverFrames() {
            const elements = this.#root.querySelectorAll("iframe");
            const newFrames = [];

            for (const el of elements) {
                if (this.#frames.has(el)) continue;

                this.#frames.add(el);
                newFrames.push(el);
            }

            return newFrames;
        }

        // Optional: clear everything
        clear() {
            this.#links.clear();
            this.#targets.clear();
            this.#frames.clear();
            this.#defaultTarget = null;
        }
    }
