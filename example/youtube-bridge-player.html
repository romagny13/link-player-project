<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>YouTube Bridge Debugger</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background: #f4f4f9;
            color: #333;
        }

        .players-container {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .player-box {
            background: #fff;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        /* Zone de logs en bas de page */
        #log-container {
            margin-top: 30px;
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 15px;
            border-radius: 8px;
            font-family: Consolas, monospace;
            font-size: 13px;
            height: 250px;
            overflow-y: auto;
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.5);
        }

        .log-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #444;
            padding-bottom: 8px;
            margin-bottom: 10px;
        }

        .log-header h3 {
            margin: 0;
            color: #fff;
            font-size: 16px;
        }

        #clear-logs {
            background: #d9534f;
            border: none;
            color: white;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }

        #clear-logs:hover {
            background: #c9302c;
        }

        .log-entry {
            margin-bottom: 4px;
            border-bottom: 1px solid #2a2a2a;
            padding-bottom: 2px;
        }

        .log-time {
            color: #888;
        }

        .log-label {
            font-weight: bold;
            color: #4ec9b0;
        }
    </style>
</head>
<body>

<h2>YouTube Test Page</h2>

<div class="players-container">
    <div class="player-box">
        <h3>YouTube Playlist</h3>
        <!-- https://www.youtube.com/embed/m_luzarfbbM?list=PLfO5yE9Cc3wo -->
        <iframe id="yt-playlist" width="560" height="315"
                src="https://www.youtube.com/embed/videoseries?list=PLfO5yE9Cc3wo&enablejsapi=1"
                title="YouTube video player" frameborder="0"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
    </div>

    <div class="player-box">
        <h3>YouTube Video List</h3>
        <!-- &index=2 -->
        <iframe id="yt-videolist" width="560" height="315"
                src="https://www.youtube.com/embed/?playlist=3HSKp9pVMKY,m_luzarfbbM,p8yXdbwFNgc&enablejsapi=1"
                title="YouTube video player" frameborder="0"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
    </div>

    <div class="player-box">
        <h3>YouTube Video List Embed created with index</h3>
        <div id="area-3"></div>
    </div>

</div>

<!-- Zone d'affichage des messages -->
<div id="log-container">
    <div class="log-header">
        <h3>Console Bridge Logs</h3>
        <button id="clear-logs">Clear</button>
    </div>
    <div id="log-content"></div>
</div>

<script>

    // pour la playlist id , l'index n'est pas supporté dans le src de l'iframe YouTube
    // sans video id => https://www.youtube.com/embed/videoseries?list=PLfO5yE9Cc3wo
    // il faut indiquer le video Id => https://www.youtube.com/embed/m_luzarfbbM?list=PLfO5yE9Cc3wo
    // l'event playlistIndexChange est 0-based

    // dans le src de l'iframe l'index pour une videoList YouTube est 1-based (1 premiere video, 2, seconde video)
    // https://www.youtube.com/embed/?playlist=3HSKp9pVMKY,m_luzarfbbM,p8yXdbwFNgc&enablejsapi=1&index=2
    // par contre l'event playlistIndexChange est 0-based

    // il faut recreer l'iframe pour que l'index soit pris en compte

    /** Event types sent to subscribers. */
    const YouTubeBridgeEvent = Object.freeze({
        Ready: "ready",
        StateChange: "stateChange",
        VideoPlay: "videoPlay",
        VideoPause: "videoPause",
        VideoBuffering: "videoBuffering",
        VideoEnded: "videoEnded",
        TimeUpdate: "timeUpdate",
        DurationChange: "durationChange",
        PlaylistIndexChange: "playlistIndexChange",
        VideoChange: "videoChange",
        VolumeChange: "volumeChange",
        MuteChange: "muteChange",
        RateChange: "rateChange",
        QualityChange: "qualityChange",
        Error: "error",
        Message: "message",
    });

    class YouTubeIframeBridge {
        #iframe;
        #window;
        #listeners = new Map(); // onEvent -> Set of event types, or null for every typed event
        #connected = false;
        #ready = false;
        #queue = [];
        #lastIndex = null;
        #known = {};

        constructor(iframe, {window = globalThis} = {}) {
            this.#iframe = iframe;
            this.#window = window;
        }

        subscribe(onEvent, {types} = {}) {
            const wanted = types ? new Set(types) : null;
            this.#listeners.set(onEvent, wanted?.size ? wanted : null);
            return () => this.#listeners.delete(onEvent);
        }

        connect() {
            if (this.#connected) return;
            this.#connected = true;
            this.#window.addEventListener("message", this.#onMessage);
            this.#iframe.addEventListener("load", this.#onIframeLoaded);
            this.#handshake(); // the iframe may already be loaded
        }

        disconnect() {
            if (!this.#connected) return;
            this.#connected = false;
            this.#window.removeEventListener("message", this.#onMessage);
            this.#iframe.removeEventListener("load", this.#onIframeLoaded);
            this.#queue.length = 0;
            this.#listeners.clear();
        }

        command(func, args = []) {
            const message = {event: "command", func, args};
            if (this.#ready) this.send(message);
            else this.#queue.push(message);
        }

        send(message) {
            this.#iframe.contentWindow?.postMessage(
                JSON.stringify(message),
                this.#getTargetOrigin()
            );
        }

        // ───────── internals ─────────

        /** Tells the player to start sending messages to this page. */
        #handshake() {
            this.send({event: "listening", id: 1, channel: "widget"});
        }

        /** Arrow function: `this` must stay the bridge when used as an event listener. */
        #onMessage = (e) => {
            if (e.source !== this.#iframe.contentWindow) return;

            const d = this.#parse(e.data);
            if (!d?.event) return;

            this.#emit({
                type: YouTubeBridgeEvent.Message,
                name: d.event,
                info: d.info
            });
            switch (d.event) {
                case "onReady":
                    this.#markReady();
                    break;
                case "initialDelivery":
                    this.#markReady();
                    this.#handleDelivery(d.info);
                    break;
                case "infoDelivery":
                    this.#handleDelivery(d.info);
                    break;
                case "onStateChange":
                    this.#handleState(d.info);
                    break;
                case "onError":
                    this.#emit({type: YouTubeBridgeEvent.Error, code: d.info});
                    break;
            }
        };

        #onIframeLoaded = () => {
            this.#ready = false;
            this.#handshake();
        };

        #handleState(state) {
            this.#emit({type: YouTubeBridgeEvent.StateChange, state});
            switch (state) {
                case 1: // playing
                    this.#emit({type: YouTubeBridgeEvent.VideoPlay});
                    break;
                case 2: // paused
                    this.#emit({type: YouTubeBridgeEvent.VideoPause});
                    break;
                case 3: // buffering
                    this.#emit({type: YouTubeBridgeEvent.VideoBuffering});
                    break;
                case 0: // ended
                    this.#emit({
                        type: YouTubeBridgeEvent.VideoEnded
                    });
                    break;
                // -1 (unstarted) and 5 (cued) only produce stateChange
            }
        }

        #handleDelivery(info = {}) {
            if (info.playerState)
                this.#handleState(info.playerState);

            if (info.currentTime) {
                this.#emit({
                    type: YouTubeBridgeEvent.TimeUpdate,
                    time: info.currentTime,
                    duration: info.duration
                });
            }

            if (info.duration) {
                this.#emit({
                    type: YouTubeBridgeEvent.DurationChange,
                    duration: info.duration
                });
            }

            if (info.playlistIndex != null)
                console.log("playlistIndexChanged => ", info?.playlistIndex);
            if (info.playlistIndex != null && info.playlistIndex !== this.#lastIndex) {
                this.#lastIndex = info.playlistIndex;
                this.#emit({
                    type: YouTubeBridgeEvent.PlaylistIndexChange,
                    index: info.playlistIndex
                });
            }

            if (info.videoData?.video_id && this.#remember("videoId", info.videoData.video_id)) {
                this.#emit({
                    type: YouTubeBridgeEvent.VideoChange,
                    videoId: info.videoData.video_id,
                    title: info.videoData.title,
                    author: info.videoData.author
                });
            }
            this.#handleSound(info);
            this.#handleRate(info.playbackRate);
            this.#handleQuality(info.playbackQuality);
        }

        /** Volume and mute come together in a delivery; each one is notified on its own change. */
        #handleSound({volume, muted} = {}) {
            const volumeChanged = this.#remember("volume", volume);
            const mutedChanged = this.#remember("muted", muted);
            const sound = {
                volume: this.#known.volume ?? null,
                muted: this.#known.muted ?? null
            };
            if (volumeChanged)
                this.#emit({type: YouTubeBridgeEvent.VolumeChange, ...sound});
            if (mutedChanged)
                this.#emit({type: YouTubeBridgeEvent.MuteChange, ...sound});
        }

        #handleRate(rate) {
            if (this.#remember("rate", rate))
                this.#emit({type: YouTubeBridgeEvent.RateChange, rate});
        }

        #handleQuality(quality) {
            if (this.#remember("quality", quality))
                this.#emit({type: YouTubeBridgeEvent.QualityChange, quality});
        }

        /** Marks the player as ready, sends the queued commands, then notifies `ready`. */
        #markReady() {
            if (this.#ready) return;
            this.#ready = true;
            this.#queue.splice(0).forEach((m) => this.send(m));
            this.#emit({type: YouTubeBridgeEvent.Ready});
        }

        #remember(name, value) {
            if (value == null || this.#known[name] === value) return false;
            this.#known[name] = value;
            return true;
        }

        #emit(event) {
            for (const [onEvent, types] of [...this.#listeners]) {
                const wanted = types
                    ? types.has(event.type)
                    : event.type !== YouTubeBridgeEvent.Message;
                if (!wanted) continue;
                try {
                    onEvent(event);
                } catch (error) {
                    console.error("[YouTubeIframeBridge] subscriber failed", error);
                }
            }
        }

        #parse(data) {
            if (typeof data !== "string") return null;
            try {
                return JSON.parse(data);
            } catch {
                return null;
            }
        }

        #getTargetOrigin() {
            try {
                return new URL(this.#iframe.src).origin;
            } catch {
                return "*";
            }
        }
    }

    class YouTubeEmbedSrcBuilder {
        static #BASE_URL = "https://www.youtube.com/embed";

        #enablejsapi;
        #origin;

        constructor({enablejsapi = false, origin = globalThis.location?.origin} = {}) {
            this.#enablejsapi = Boolean(enablejsapi);
            this.#origin = origin && origin !== "null" ? origin : null; // "null" = file:// pages
        }

        get enablejsapi() {
            return this.#enablejsapi;
        }

        get origin() {
            return this.#origin;
        }

        #params({autoplay, startSeconds} = {}) {
            const q = new URLSearchParams();
            if (this.#enablejsapi) {
                q.set("enablejsapi", "1");
                if (this.#origin) q.set("origin", this.#origin);
            }
            if (autoplay) q.set("autoplay", "1");
            if (startSeconds > 0) q.set("start", String(Math.floor(startSeconds)));
            return q;
        }

        #url(path, q) {
            const s = q.toString();
            return `${YouTubeEmbedSrcBuilder.#BASE_URL}/${path}${s ? `?${s}` : ""}`;
        }

        buildVideoSrc(videoId, {autoplay, startSeconds} = {}) {
            if (!videoId) throw new TypeError("buildVideoSrc(): videoId is required");
            const q = this.#params({autoplay, startSeconds});
            return this.#url(encodeURIComponent(videoId), q);
        }

        buildVideoListSrc(videoIds, {autoplay, index, startSeconds} = {}) {
            if (!Array.isArray(videoIds) || !videoIds.length)
                throw new TypeError("buildVideoListSrc(): a non-empty array is required");

            const [first, ...rest] = videoIds;
            const q = this.#params({autoplay, startSeconds});
            if (rest.length) q.set("playlist", rest.join(","));
            if (index >= 0) q.set("index", String(Math.floor(index + 1))); // 1-based
            return this.#url(encodeURIComponent(first), q);
        }

        buildPlaylistSrc(playlistId, {autoplay, videoId} = {}) {
            if (!playlistId) throw new TypeError("buildPlaylistSrc(): playlistId is required");

            const q = this.#params({autoplay});
            q.set("list", playlistId);
            return this.#url(videoId ? encodeURIComponent(videoId) : "videoseries", q);
        }
    }

    function makeIframe({
                            width,
                            height,
                            src,
                            allow,
                            title,
                            referrerPolicy,
                            allowFullscreen = true,
                            extraAttrs = {}
                        }) {
        const iframe = document.createElement("iframe");

        if (width) iframe.width = width;
        if (height) iframe.height = height;

        if (!src) throw new TypeError("makeIframe(): src is required");
        iframe.src = src;
        if (title) iframe.title = title;
        iframe.frameBorder = "0";

        if (allow) iframe.allow = allow;

        if (referrerPolicy) iframe.referrerPolicy = referrerPolicy;
        if (allowFullscreen) iframe.allowFullscreen = true;

        // adding extra attributes
        for (const [k, v] of Object.entries(extraAttrs)) iframe.setAttribute(k, v);

        return iframe;
    }

    function logToScreen(label, ev) {
        const contentDiv = document.getElementById("log-content");
        const time = new Date().toLocaleTimeString();
        const entry = document.createElement("div");
        entry.className = "log-entry";

        // On formate joliment l'objet
        entry.innerHTML = `<span class="log-time">[${time}]</span> <span class="log-label">${label}:</span> ${JSON.stringify(ev)}`;
        contentDiv.appendChild(entry);

        // Auto-scroll vers le bas
        const container = document.getElementById("log-container");
        container.scrollTop = container.scrollHeight;
    }

    // Initialisation du Player 1 (Playlist)
    // const b1 = new YouTubeIframeBridge(document.getElementById("yt-playlist"));
    // const b1 = new YouTubeIframeBridge(document.getElementById("yt-videolist"));

    let index = 0;
    const builder = new YouTubeEmbedSrcBuilder({enablejsapi: true});
    const src = builder.buildVideoListSrc(["3HSKp9pVMKY", "m_luzarfbbM,p8yXdbwFNgc"], {index: 1});
    console.log("src", src);
    const created = makeIframe({
        width: "560",
        height: "315",
        src,
        title: "YouTube video player",
        allow:
            "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share",
        referrerPolicy: "strict-origin-when-cross-origin",
        allowFullscreen: true,
        extraAttrs: {}
    });
    document.getElementById("area-3").replaceChildren(created);

    const b1 = new YouTubeIframeBridge(created);

    // Gestion du bouton effacer
    document.getElementById("clear-logs").addEventListener("click", () => {
        document.getElementById("log-content").innerHTML = "";
    });

    ;
    b1.subscribe((ev) => {
        logToScreen("Playlist", ev);
        console.log("Playlist YouTube", ev);
    }, {
        types: [
            YouTubeBridgeEvent.PlaylistIndexChange,
            YouTubeBridgeEvent.VideoChange
        ]
    });
    b1.connect();

</script>

</body>
</html>
