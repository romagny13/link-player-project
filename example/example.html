<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Link player</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 12px;
        }

        nav {
            display: flex;
            gap: 12px;
            margin-bottom: 8px;
        }

        .video-container {
            position: relative;
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08), 0 4px 12px rgba(0, 0, 0, 0.04);
        }

        .video-container:empty {
            display: none;
        }

        .video-container::before {
            content: "";
            display: block;
            padding-top: 56.25%; /* 16:9 */
        }

        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 6px;
            margin: 8px 0 24px;
        }

        .controls button {
            padding: 4px 10px;
            border: 1px solid #bbb;
            border-radius: 6px;
            background: #fff;
            cursor: pointer;
        }

        .controls button:disabled {
            opacity: .4;
            cursor: not-allowed;
        }

        .status {
            margin-left: auto;
            font-size: 12px;
            color: #666;
        }
    </style>
</head>
<body>

<h3>Links + code-defined infos (the links only navigate)</h3>
<nav>
    <a data-link data-target="t-1" href="https://www.youtube.com/watch?v=z2sv_RsNwM4&t=2712s">Single Video</a>
    <a data-link data-target="t-1"
       href="https://www.youtube.com/watch_videos?video_ids=z2sv_RsNwM4,-xiF9YIIUk4&index=1">Video List</a>
    <a data-link data-target="t-1" href="https://www.youtube.com/watch?v=s11CNT_hQTg&list=PLYALQE76y6LQ">Playlist</a>
</nav>
<div id="t-1" class="video-container"></div>
<div class="controls" data-controls="t-1"></div>

<h3>Existing iframe (adopted: the panel is added)</h3>
<div id="t-2" class="video-container">
    <iframe data-link data-target="t-2"
            src="https://www.youtube.com/embed/videoseries?list=PLYALQE76y6LQ"
            title="YouTube video player"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            allowfullscreen></iframe>
</div>
<div class="controls" data-controls="t-2"></div>

<script type="module">
    import {LinkPlayer} from "../src/LinkPlayer.js";

    const lp = new LinkPlayer({
        okruEmbedBaseUrl: "https://okru-embed.vercel.app/",
        fallbackTitle: (i) => `Vidéo ${i + 1}`,
        //youtubeApiKey: "AIzaSyDGgMOJkyudMYOyKRoTqbFVpcTLJKvOk4M",  // titles / thumbnails of a playlist that has no data-videos (cached)
        // definitions: {
        //     // key = info.key: infos defined in code, the link stays a plain navigation link
        //     "youtube:z2sv_RsNwM4": {title: "Bruits de train et de pluie", channel: "Relaxing White Noise"},
        //     "youtube:list:z2sv_RsNwM4,-xiF9YIIUk4": {
        //         videos: [{title: "Train and rain"}, {title: "Second video"}]
        //     }
        // },
        onError: ({error, element, region}) => console.warn("[example]", region?.target, element, error)
    });

    // [action, label, run, enabled]
    const ACTIONS = [
        ["back", "◀ Back", (r) => r.goBack(), (r) => r.canGoBack],
        ["forward", "Forward ▶", (r) => r.goForward(), (r) => r.canGoForward],
        ["prevInfo", "⏮ Previous link", (r) => r.previousInfo(), (r) => r.canGoPreviousInfo],
        ["nextInfo", "Next link ⏭", (r) => r.nextInfo(), (r) => r.canGoNextInfo],
        ["prevItem", "◁ Previous video", (r) => r.previousItem(), (r) => r.canGoPreviousItem],
        ["nextItem", "Next video ▷", (r) => r.nextItem(), (r) => r.canGoNextItem],
        ["toggle", "Show / hide", (r) => r.toggle(), (r) => r.current !== null]
    ];

    const region = (target) => lp.regions.find((r) => r.target === target);

    for (const box of document.querySelectorAll("[data-controls]")) {
        for (const [action, label] of ACTIONS) {
            const button = document.createElement("button");
            button.kind = "button";
            button.dataset.action = action;
            button.textContent = label;
            box.append(button);
        }
        const status = document.createElement("span");
        status.className = "status";
        box.append(status);

        box.addEventListener("click", (e) => {
            const action = e.target.closest("[data-action]")?.dataset.action;
            const r = region(box.dataset.controls);
            if (r && action) ACTIONS.find((a) => a[0] === action)[2](r);
        });
    }

    function refresh(r, state) {
        const box = document.querySelector(`[data-controls="${r.target}"]`);
        for (const button of box.querySelectorAll("[data-action]")) {
            const enabled = ACTIONS.find((a) => a[0] === button.dataset.action)[3];
            button.disabled = !enabled(r);
        }
        const status = box.querySelector(".status");
        const item = r.itemCount ? ` · item ${r.currentIndex + 1}/${r.itemCount}` : "";
        status.textContent = `${r.current?.key ?? "nothing"}${item}${state ? ` · ${state}` : ""}${r.isVisible ? "" : " · hidden"}`;
    }

    lp.on("change", ({region: r}) => refresh(r));
    lp.on("state", ({region: r, state}) => refresh(r, state));
    // example : l'erreur de scan contient aussi l'élément
    lp.regions.forEach((r) => refresh(r)); // the first scan ran before the listeners existed
</script>
</body>
</html>
