    <style>
        /* ====================================================================
           Thème "étagère vidéoclub" — scoping strict à #series-article
           ==================================================================== */
        #series-article {
            --sa-bg: #1c140f;
            --sa-bg-alt: #241a13;
            --sa-paper: #f4ead8;
            --sa-ink: #2b1d12;
            --sa-ink-soft: #4a3826;
            --sa-amber: #e8923a;
            --sa-teal: #2f8f86;
            --sa-mustard: #cf9a2e;
            --sa-cream: #f3e8d6;
            --sa-line: #52402c;

            --font-display: 'Bebas Neue', 'Arial Narrow', sans-serif;
            --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;

            background: var(--sa-bg);
            color: var(--sa-cream);
            font-family: var(--font-body);
            padding: 24px;
            border-radius: 6px;
            box-sizing: border-box;
        }

        #series-article *,
        #series-article *::before,
        #series-article *::after {
            box-sizing: inherit;
        }

        #series-article a {
            color: inherit;
        }

        /* --- Lecteur --- */
        #series-article .sa-player {
            position: relative;
            background: var(--sa-bg-alt);
            border: 2px solid var(--sa-line);
            border-radius: 4px;
            padding: 10px;
            margin-bottom: 28px;
        }

        #series-article .sa-player-badge {
            position: absolute;
            top: -14px;
            left: 16px;
            background: var(--sa-amber);
            color: var(--sa-ink);
            font-family: var(--font-display);
            letter-spacing: 0.04em;
            font-size: 15px;
            padding: 3px 12px 4px;
            border-radius: 2px;
            box-shadow: 3px 3px 0 rgba(0, 0, 0, 0.35);
        }

        #series-article .sa-player-frame {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background: repeating-linear-gradient(
                    0deg,
                    rgba(255, 255, 255, 0.025) 0px,
                    rgba(255, 255, 255, 0.025) 1px,
                    transparent 1px,
                    transparent 3px
            ),
            #0e0b08;
            border-radius: 2px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #series-article .sa-player-frame iframe {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        #series-article .sa-player-placeholder {
            color: var(--sa-ink-soft);
            font-size: 14px;
            text-align: center;
            padding: 0 20px;
        }

        /* --- Étagère de séries --- */
        #series-article .sa-shelf-heading {
            font-family: var(--font-display);
            font-size: 22px;
            letter-spacing: 0.02em;
            color: var(--sa-mustard);
            margin: 0 0 14px;
        }

        #series-article .sa-shelf {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 14px;
            align-items: start;
        }

        /* Chaque série = une "cassette" */
        #series-article .sa-tape {
            background: var(--sa-bg-alt);
            border: 2px solid var(--sa-line);
            border-radius: 3px;
            overflow: hidden;
            transition: border-color 0.15s ease;
        }

        #series-article .sa-tape.is-open {
            border-color: var(--sa-amber);
            /* la fiche dépliée prend toute la largeur de la grille pour rester lisible */
            grid-column: 1 / -1;
        }

        #series-article .sa-tape-spine {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            background: transparent;
            border: 0;
            cursor: pointer;
            color: var(--sa-cream);
            padding: 12px 14px;
            text-align: left;
            font: inherit;
        }

        #series-article .sa-tape-spine:hover {
            background: rgba(232, 146, 58, 0.08);
        }

        #series-article .sa-tape-spine:focus-visible {
            outline: 2px solid var(--sa-amber);
            outline-offset: -2px;
        }

        #series-article .sa-tape-title {
            font-family: var(--font-display);
            font-size: 18px;
            letter-spacing: 0.01em;
            line-height: 1.15;
        }

        #series-article .sa-tape-chevron {
            flex: 0 0 auto;
            color: var(--sa-teal);
            transition: transform 0.2s ease;
            font-size: 14px;
        }

        #series-article .sa-tape.is-open .sa-tape-chevron {
            transform: rotate(180deg);
        }

        #series-article .sa-tape-body {
            padding: 4px 16px 18px;
            border-top: 1px dashed var(--sa-line);
        }

        #series-article .sa-tape-desc {
            background: var(--sa-paper);
            color: var(--sa-ink);
            padding: 14px 16px;
            border-radius: 2px;
            margin: 14px 0;
            font-size: 14.5px;
            line-height: 1.55;
        }

        #series-article .sa-tape-desc p {
            margin: 0 0 10px;
        }

        #series-article .sa-tape-desc p:last-child {
            margin-bottom: 0;
        }

        #series-article .sa-tape-desc strong {
            color: var(--sa-ink);
        }

        #series-article .sa-tape-desc a {
            color: #8a3f14;
            text-decoration: underline;
            text-decoration-color: rgba(138, 63, 20, 0.4);
        }

        #series-article .sa-tape-desc a:hover {
            text-decoration-color: #8a3f14;
        }

        /* Boutons "ticket" pour les liens (Épisodes, etc.) */
        #series-article .sa-tape-links {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        #series-article .sa-link-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--sa-teal);
            color: #06211e;
            font-weight: 600;
            font-size: 14px;
            padding: 9px 16px;
            border-radius: 2px;
            text-decoration: none;
            border: 1px dashed rgba(6, 33, 30, 0.35);
            box-shadow: 3px 3px 0 rgba(0, 0, 0, 0.3);
            transition: transform 0.12s ease, box-shadow 0.12s ease;
        }

        #series-article .sa-link-btn:hover {
            transform: translate(-1px, -1px);
            box-shadow: 4px 4px 0 rgba(0, 0, 0, 0.3);
        }

        #series-article .sa-link-btn:focus-visible {
            outline: 2px solid var(--sa-cream);
            outline-offset: 2px;
        }

        #series-article .sa-link-btn.is-active {
            background: var(--sa-amber);
            color: var(--sa-ink);
        }

        #series-article .sa-link-btn.is-active::after {
            content: "\25B6 en cours";
            font-size: 11px;
            font-weight: 700;
            opacity: 0.75;
        }

        @media (prefers-reduced-motion: reduce) {
            #series-article .sa-tape-chevron,
            #series-article .sa-link-btn {
                transition: none;
            }
        }

        @media (max-width: 560px) {
            #series-article {
                padding: 16px;
            }

            #series-article .sa-tape-title {
                font-size: 17px;
            }
        }

        /* --- Badge "NEW" pour les séries récemment ajoutées --- */
        #series-article .sa-new {
            display: inline-block;
            margin-left: 8px;
            padding: 2px 8px 3px;
            background: var(--sa-amber);
            color: var(--sa-ink);
            font-family: var(--font-display);
            font-size: 13px;
            letter-spacing: 0.08em;
            line-height: 1.1;
            text-transform: uppercase;
            border-radius: 2px;
            box-shadow: 2px 2px 0 rgba(0, 0, 0, 0.35);
            transform: rotate(-3deg);
            vertical-align: middle;
        }
    </style>

            const shelf = document.getElementById('sa-shelf');

            // --- Sauvegarde / restauration de la série en cours ---
            const STORAGE_KEY = 'series-article:last-watched';

            function plainTitle(serie) {
                const tmp = document.createElement('div');
                tmp.innerHTML = serie.title;
                return tmp.textContent.replace(/\s+/g, ' ').trim();
            }

            function saveSelection(linkEl) {
                try {
                    const tape = linkEl.closest('.sa-tape');
                    if (!tape) return;
                    const serie = SERIES[Number(tape.dataset.index)];
                    const linkIndex = Array.from(tape.querySelectorAll('.sa-link-btn')).indexOf(linkEl);
                    localStorage.setItem(STORAGE_KEY, JSON.stringify({
                        title: plainTitle(serie),
                        linkIndex: Math.max(linkIndex, 0)
                    }));
                } catch (e) {
                    console.warn('Sauvegarde impossible', e);
                }
            }

            function restoreSelection() {
                try {
                    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
                    if (!saved || !saved.title) return null;
                    const i = SERIES.findIndex(s => plainTitle(s) === saved.title);
                    if (i === -1) return null;
                    const tape = shelf.querySelector(`.sa-tape[data-index="${i}"]`);
                    if (!tape) return null;
                    const links = tape.querySelectorAll('.sa-link-btn');
                    return links[saved.linkIndex] || links[0] || null;
                } catch (e) {
                    return null;
                }
            }

            function renderShelf() {
                shelf.innerHTML = SERIES.map((serie, i) => `
          <article class="sa-tape" data-index="${i}">
            <button class="sa-tape-spine" type="button" aria-expanded="false" aria-controls="sa-desc-${i}">
              <span class="sa-tape-title">${serie.title}</span>
              <span class="sa-tape-chevron" aria-hidden="true">▾</span>
            </button>
            <div class="sa-tape-body" id="sa-desc-${i}" hidden>
              <div class="sa-tape-desc">${serie.desc}</div>
              <div class="sa-tape-links">
                ${serie.links.map(link => `
                  <a class="sa-link-btn" data-link data-target="series-gp1" href="${link.url}"${link.showOnInit ? ' data-show-on-init' : ''}>
                    <i class="${link.icon}" aria-hidden="true"></i>
                    <span>${link.label}</span>
                  </a>
                `).join('')}
              </div>
            </div>
          </article>
        `).join('');
            }

            renderShelf();

            // --- Accordéon + état "actif", indépendant des plugins de lecture ---
            function openTape(tape, {exclusive = false} = {}) {
                if (exclusive) {
                    shelf.querySelectorAll('.sa-tape.is-open').forEach(other => {
                        if (other !== tape) closeTape(other);
                    });
                }
                tape.classList.add('is-open');
                tape.querySelector('.sa-tape-spine').setAttribute('aria-expanded', 'true');
                tape.querySelector('.sa-tape-body').hidden = false;
            }

            function closeTape(tape) {
                tape.classList.remove('is-open');
                tape.querySelector('.sa-tape-spine').setAttribute('aria-expanded', 'false');
                tape.querySelector('.sa-tape-body').hidden = true;
            }

            function setActiveLink(linkEl) {
                shelf.querySelectorAll('.sa-link-btn.is-active').forEach(el => el.classList.remove('is-active'));
                linkEl.classList.add('is-active');
                const tape = linkEl.closest('.sa-tape');
                if (tape) openTape(tape, {exclusive: true});
                saveSelection(linkEl); // <-- ajout
            }

            shelf.addEventListener('click', (e) => {
                const spineBtn = e.target.closest('.sa-tape-spine');
                if (spineBtn) {
                    const tape = spineBtn.closest('.sa-tape');
                    tape.classList.contains('is-open') ? closeTape(tape) : openTape(tape);
                    return;
                }
                const link = e.target.closest('.sa-link-btn');
                if (link) setActiveLink(link);
            });

            // Restaure la dernière série regardée, sinon garde celle marquée data-show-on-init
            const restoredLink = restoreSelection();
            if (restoredLink) {
                // transfère le marqueur d'init pour que le lecteur démarre sur la bonne série
                shelf.querySelectorAll('[data-show-on-init]').forEach(el => el.removeAttribute('data-show-on-init'));
                restoredLink.setAttribute('data-show-on-init', '');
            }
            const initLink = shelf.querySelector('[data-show-on-init]');
            if (initLink) setActiveLink(initLink);

                    const link = entry.info.link;
                    if (link) setActiveLink(link);
