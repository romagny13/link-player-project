<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Document</title>
</head>
<body>
<button id="btn">Lancer</button>

<div id="target"></div>

<script type="module">
    import {YouTubeProvider} from "../src/providers/youtube/YouTubeProvider.js";
    import {VideoInfo} from "../src/models/VideoInfo.js";

    document.getElementById("btn").addEventListener("click", () => {
        const provider = new YouTubeProvider();
        const player = provider.createPlayer();
        player.load(
            new VideoInfo({provider: "youtube", videoId: "YCfcg9gzCYc", target: "target"}),
            {autoplay: true}
        );
       // player.play();
        document.getElementById("target").prepend(player.iframe);
    })


    const provider = new YouTubeProvider();
    const player = provider.createPlayer();
    player.load(
        new VideoInfo({provider: "youtube", videoId: "YCfcg9gzCYc", target: "target"}),
        {autoplay: true}
    );
    player.play();
    document.getElementById("target").prepend(player.iframe);

</script>
</body>
</html>
