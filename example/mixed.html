<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>LinkPlayer : page d'exemples mixtes</title>
    <style>
        :root {
            color-scheme: light dark;
            --bg: #f5f6f8;
            --card: #ffffff;
            --ink: #1a1f26;
            --muted: #5a6572;
            --line: #dbe0e6;
            --accent: #c2410c;
            --accent-ink: #ffffff;
            --chip-yt: #b91c1c;
            --chip-ok: #b45309;
            --ok: #15803d;
            --err: #b91c1c;
            --warn: #a16207;
            --code: #eef0f3;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0e1217;
                --card: #161b22;
                --ink: #e6eaef;
                --muted: #98a3b0;
                --line: #29313b;
                --accent: #fb923c;
                --accent-ink: #1a1208;
                --chip-yt: #f87171;
                --chip-ok: #fbbf24;
                --ok: #4ade80;
                --err: #f87171;
                --warn: #facc15;
                --code: #1f262f;
            }
        }

        * {
            box-sizing: border-box;
        }

        [hidden] {
            display: none !important;
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--ink);
            font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
        }

        .layout {
            max-width: 800px;
            margin: 0 auto;
            padding: 24px 16px 80px;
        }

        @media (max-width: 1000px) {
            .layout {
                grid-template-columns: 1fr;
            }

            aside {
                position: static !important;
                max-height: none !important;
            }
        }

        header h1 {
            margin: 0 0 4px;
            font-size: 1.6rem;
        }

        header p, .what, .note {
            color: var(--muted);
            margin: 6px 0 12px;
        }

        code, pre {
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            font-size: .86em;
        }

        code {
            background: var(--code);
            padding: 1px 5px;
            border-radius: 4px;
        }

        pre {
            background: var(--code);
            padding: 10px 12px;
            border-radius: 8px;
            overflow: auto;
            margin: 8px 0 12px;
        }

        nav.toc {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin: 12px 0 20px;
        }

        nav.toc a {
            padding: 4px 10px;
            border: 1px solid var(--line);
            border-radius: 999px;
            text-decoration: none;
            color: var(--ink);
            background: var(--card);
            font-size: .9rem;
        }

        section.sec {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 18px 20px;
            margin: 0 0 22px;
        }

        section.sec > h2 {
            margin: 0 0 2px;
            font-size: 1.2rem;
        }

        h3 {
            margin: 18px 0 4px;
            font-size: 1rem;
        }

        .links {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin: 8px 0;
        }

        .links a, button {
            font: inherit;
            font-size: .92rem;
            padding: 6px 12px;
            border-radius: 8px;
            border: 1px solid var(--line);
            background: var(--card);
            color: var(--ink);
            cursor: pointer;
            text-decoration: none;
        }

        .links a:hover, button:hover:not(:disabled) {
            border-color: var(--accent);
        }

        button:disabled {
            opacity: .4;
            cursor: not-allowed;
        }

        button.primary {
            background: var(--accent);
            color: var(--accent-ink);
            border-color: var(--accent);
        }

        .chip {
            display: inline-block;
            font-size: .68rem;
            font-weight: 700;
            letter-spacing: .03em;
            padding: 1px 6px;
            border-radius: 4px;
            margin-right: 6px;
            color: #fff;
            vertical-align: 1px;
        }

        .chip.yt {
            background: var(--chip-yt);
        }

        .chip.ok {
            background: var(--chip-ok);
        }

        .player-zone {
            min-height: 72px;
            border: 1px dashed var(--line);
            border-radius: 10px;
            padding: 8px;
            margin: 10px 0 6px;
        }

        .player-zone:empty::before {
            content: "zone cible : rien d'affiché pour l'instant";
            color: var(--muted);
            font-size: .85rem;
        }

        .player-zone iframe {
            display: block;
            width: 100%;
            height: auto;
            aspect-ratio: 16 / 9;
            border: 0;
            border-radius: 8px;
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 6px;
            margin: 6px 0 4px;
        }

        .controls .sep {
            width: 1px;
            align-self: stretch;
            background: var(--line);
            margin: 0 4px;
        }

        .status {
            font-size: .82rem;
            color: var(--muted);
            margin-left: auto;
        }

        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        @media (max-width: 700px) {
            .row {
                grid-template-columns: 1fr;
            }
        }

        .tag {
            font-size: .75rem;
            font-weight: 600;
            padding: 2px 8px;
            border-radius: 999px;
            border: 1px solid var(--line);
            color: var(--muted);
        }

        .details {
            border-left: 3px solid var(--accent);
            padding: 4px 12px;
            margin: 10px 0;
            min-height: 3.2em;
        }

        .details strong {
            display: block;
        }

        .warn {
            color: var(--warn);
        }

        aside {
            position: sticky;
            top: 16px;
            align-self: start;
            max-height: calc(100vh - 32px);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        aside .box {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 12px 14px;
        }

        aside h2 {
            margin: 0 0 8px;
            font-size: 1rem;
        }

        aside input {
            width: 100%;
            font: inherit;
            font-size: .85rem;
            padding: 6px 8px;
            border-radius: 6px;
            border: 1px solid var(--line);
            background: var(--bg);
            color: var(--ink);
            margin-bottom: 6px;
        }

        #log {
            list-style: none;
            margin: 0;
            padding: 0;
            overflow: auto;
            max-height: 46vh;
            font-size: .78rem;
            font-family: ui-monospace, monospace;
        }

        #log li {
            padding: 3px 0;
            border-bottom: 1px solid var(--line);
            word-break: break-word;
        }

        #log .who {
            color: var(--muted);
        }

        #log .t-change {
            color: var(--ok);
        }

        #log .t-state {
            color: var(--accent);
        }

        #log .t-error {
            color: var(--err);
            font-weight: 600;
        }

        a[data-link].is-active {
            border-color: #f7931e;
        }
    </style>
</head>
<body>
<div class="layout">
    <section class="sec" id="sec-mixed-youtube">
        <h2>YouTube</h2>
        <div class="links" id="mixed-links-youtube">
            <!-- data-key="yt-1"  -->
            <a data-link href="https://www.youtube.com/watch?v=YCfcg9gzCYc"><span
                    class="chip yt">YT</span>Simple</a>
            <a data-link href="https://www.youtube.com/watch_videos?video_ids=z2sv_RsNwM4,-xiF9YIIUk4"><span
                    class="chip yt">YT</span>Liste</a>
            <a data-link href="https://www.youtube.com/watch?v=s11CNT_hQTg&list=PLYALQE76y6LQ"><span
                    class="chip yt">YT</span>Playlist</a>
        </div>

        <div class="player-zone" id="player-youtube-mixed"></div>
        <div id="youtube-infos">
            <h2 id="youtube-title"></h2>
            <p id="youtube-description"></p>
        </div>
    </section>

    <section class="sec" id="sec-mixed-okru">
        <h2>Ok.ru</h2>
        <div class="links" id="mixed-links-okru">
<!--            <a data-link href="https://ok.ru/video/17222095800962"><span class="chip ok">OK</span>Simple</a>-->
<!--            <a data-link-->
<!--               href="https://ok.ru/video/15605389658754?video_ids=15605389658754,15629334874754&labels=MacGyver%20S01E06%20VF%20%7C%20Le%20Monde%20de%20Trumbo%20(French)%20%7C%20Les%20Fourmis%20Tueuses,MacGyver%20S01E11%20VF%20%7C%20Cauchemars%20(French)%20%7C%20Un%20Poison%20qui%20Tue%20en%206%20Heures"><span-->
<!--                    class="chip ok">OK</span>Ancienne version</a>-->

            <a data-link href="https://ok.ru/video/15605389658754?video_ids=17192094206594,17222095800962,17659571866242"><span class="chip ok">OK</span>Liste</a>

        </div>

        <div class="player-zone" id="player-okru-mixed"></div>
        <div id="okru-infos">
            <h2 id="okru-title"></h2>
            <p id="okru-description"></p>
        </div>
    </section>
</div>
<script type="module">
    import {LinkPlayer} from "../src/LinkPlayer.js";
    import {VideoListInfo} from "../src/models/VideoListInfo.js";
    import {VideoInfo} from "../src/models/VideoInfo.js";
    import {PlaylistInfo} from "../src/models/PlaylistInfo.js";

    const ytTitleEl = document.getElementById("youtube-title");
    const ytDescEl = document.getElementById("youtube-description");
    const okTitleEl = document.getElementById("okru-title");
    const okDescEl = document.getElementById("okru-description");

    function getVideoInfo({ info, index }) {
        if (info instanceof VideoInfo) {
            return info;
        }
        if (info instanceof VideoListInfo || info instanceof PlaylistInfo) {
            return info.videos?.[index] ?? null;
        }
        return null;
    }

    const definitions = [
        {
        //key: "yt-1", // remplace info key, plus facile pour la navigation en code (key sur link + def)
        // URL or Provider + VideoId
        provider: "youtube",
        videoId: "YCfcg9gzCYc", // obligatoire
        title: "Titre de vidéo simple",
        description: "Description de vidéo simple.",
        autoplay: "true",
        start: "120s"
    },
        {
        // URL or Provider + VideoIds or key
        provider: "youtube", // repetition
        videoIds: ["z2sv_RsNwM4", "-xiF9YIIUk4"],// repetition avec videos
        autoplay: "true",
        videos: [
            {
                //videoId: "z2sv_RsNwM4",
                title: "Titre de la première video de la liste",
                description: "Description de la première video de la liste",
                channel: "Test channel"
            },
            {
                //videoId: "-xiF9YIIUk4",
                title: "Titre de la seconde video de la liste",
                description: "Description de la seconde video de la liste",
                channel: "Test channel"
            }
        ]
    },
        {
        // URL or Provider + playlistId
        provider: "youtube",
        videoId: "s11CNT_hQTg",
        playlistId: "PLYALQE76y6LQ", // obligatoire
        videos: [
            {
                //videoId: "z2sv_RsNwM4", // peut ne pas correspondre aux vrais elements de la playlist,
                // PB cela jouera quand même la vraie video de la playlist et non le video id fourni
                //videoId: "s11CNT_hQTg",
                title: "Titre de la première video de la playlist",
                description: "Description de la première video de la playlist",
                channel: "Test channel"
            },
            {
                //videoId: "C_dEl2cMCEA",
                title: "Titre de la seconde video de la playlist",
                description: "Description de la seconde video de la playlist",
                channel: "Test channel"
            }
        ]

    }
    ];

    const lp = new LinkPlayer({
        scope: "sec-mixed-youtube",
        defaultTarget: "player-youtube-mixed",
        //youtubeApiKey: "AIzaSyDGgMOJkyudMYOyKRoTqbFVpcTLJKvOk4M",
        youtubeMetaScope: "all",
        youtubeMetaRequired: ["videoId","title", "description", "channel", "thumbnail", "channelUrl"],
        useStorage: false,
        definitions
    });
    const r = lp.regions[0];
    r.on("change", (e) => {
        console.log(e);
        const video = getVideoInfo(e);
        //console.log("video", video);
        ytTitleEl.textContent = video?.title ?? "";
        ytDescEl.textContent = video?.description ?? "";
    });

    const OKRU_BASE = "https://okru-embed.vercel.app/";

    const defsOk = [
        {
            provider: "okru",
            videoId: "17222095800962",
            title: "Titre de vidéo simple okru",
            description: "Description de vidéo simple okru.",
            autoplay: "true",
            start: "120s"
        },
        {
            // URL or Provider + VideoIds or key
            provider: "okru", // repetition
            videoId: "17192094206594",
            videoIds: ["17192094206594","17222095800962","17659571866242"],
            autoplay: "true",
            videos: [
                {
                    title: "Titre de la première video de la liste ok",
                    description: "Description de la première video de la liste ok",
                    channel: "Test channel"
                },
                {
                    title: "Titre de la seconde video de la liste ok",
                    description: "Description de la seconde video de la liste ok",
                    channel: "Test channel"
                },
                {
                    title: "Titre de la troisième video de la liste ok",
                    description: "Description de la troisième video de la liste ok",
                    channel: "Test channel"
                }
            ]
        }
    ];

    const lpOk = new LinkPlayer({
        scope: "sec-mixed-okru",
        defaultTarget: "player-okru-mixed",
        useStorage: false,
        okruEmbedBaseUrl: OKRU_BASE,
        definitions: defsOk
    });
    const rOk = lpOk.regions[0];
    rOk.on("change", (e) => {
        console.log(e);
        const video = getVideoInfo(e);
        //console.log("video", video);
        okTitleEl.textContent = video?.title ?? "";
        okDescEl.textContent = video?.description ?? "";
    });

</script>
</body>
</html>
