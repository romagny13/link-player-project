<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>LinkPlayer – Code only</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Color+Emoji&display=swap" rel="stylesheet">
    <style>
        :root {
            --ink: #6b4f27;
            --gold: #f0b95a;
            --line: #f1eadb;
        }

        body {
            margin: 0;
            padding: 24px 12px;
            font-family: "Segoe UI", system-ui, sans-serif;
            color: var(--ink);
            background: #fffdf9;
        }

        #app {
            max-width: 1100px;
            margin: 0 auto;
        }

        .video-container {
            position: relative;
            width: 100%;
            aspect-ratio: 16/9;
            overflow: hidden;
            border-radius: 20px;
            background: #f6f2ea;
            border: 5px solid #fff;
            box-shadow: 0 18px 44px rgba(120, 100, 60, .22), 0 0 0 1px var(--line);
        }

        .video-container iframe {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        .grid-4 {
            display: grid;
            grid-template-columns:repeat(4, 1fr);
            gap: 16px;
            margin-top: 16px;
        }

        .dest {
            position: relative;
            aspect-ratio: 16/9;
            padding: 0;
            overflow: hidden;
            cursor: pointer;
            border: 3px solid #fff;
            border-radius: 16px;
            background: #f6f2ea;
            box-shadow: 0 8px 20px rgba(120, 100, 60, .14);
            transition: transform .3s, box-shadow .3s;
        }

        .dest img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .dest span {
            position: absolute;
            inset: auto 0 8px;
            color: #fff;
            font: italic 600 1.1rem Georgia, serif;
            text-shadow: 0 2px 10px rgba(90, 58, 12, .7);
            text-align: center;
        }

        .dest:hover, .dest:focus-visible, .dest.is-playing {
            transform: translateY(-4px);
        }

        .dest.is-playing {
            box-shadow: 0 0 0 3px rgba(240, 185, 90, .9), 0 16px 32px rgba(120, 100, 60, .2);
        }

        .nav {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 16px;
        }

        .nav-label {
            flex: 1;
            text-align: center;
            font: italic 600 1.2rem Georgia, serif;
        }

        .nav button {
            padding: 9px 18px;
            cursor: pointer;
            color: #a97a2a;
            background: #fffaf0;
            border: 1px solid #f1e4c4;
            border-radius: 999px;
            font-size: .72rem;
            font-weight: 600;
            letter-spacing: .16em;
            text-transform: uppercase;
        }

        .nav button:disabled {
            opacity: .4;
            cursor: not-allowed;
        }

        .details {
            margin-top: 16px;
            padding: 14px 20px;
            border: 1px solid var(--line);
            border-radius: 16px;
            background: #fff;
        }

        .details h2 {
            margin: 0 0 6px;
            font: italic 600 1.4rem Georgia, serif;
        }

        .details p {
            margin: 0 0 8px;
            line-height: 1.5;
            font-family: system-ui, "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif;
        }

        .details small {
            display: block;
            margin-top: 6px;
            color: #a97a2a;
        }

        @media (max-width: 800px) {
            .grid-4 {
                grid-template-columns:repeat(2, 1fr);
            }
        }


        /* --- Styles du panneau description / YouTube-like --- */
        .details {
            position: relative;
        }

        .details p {
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            -webkit-box-orient: vertical;
            transition: max-height 0.3s ease;
        }

        /* État plié (par défaut) : limité à 3 lignes */
        .details.is-collapsed p {
            -webkit-line-clamp: 3;
            max-height: 4.5em; /* environ 3 lignes */
        }

        /* État déplié : affiche tout */
        .details.is-expanded p {
            -webkit-line-clamp: unset;
            max-height: none;
        }

        /* Bouton Lire la suite / Moins */
        .details-toggle {
            background: none;
            border: none;
            padding: 0;
            margin-top: 6px;
            color: var(--ink);
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            text-decoration: underline;
        }

        .details-toggle:hover {
            color: #a97a2a;
        }
    </style>
</head>
<body>
<div id="app">
    <div id="footage-gp1" class="video-container"></div>

    <section class="details is-collapsed" id="details" hidden>
        <h2></h2>
        <p></p>
        <button class="details-toggle" type="button">Afficher plus</button>
        <a target="_blank" rel="noopener"></a>
        <small></small>
    </section>

    <div class="grid-4" id="destinations"></div>
    <div class="nav">
        <button type="button" id="prev">← Précédent</button>
        <span class="nav-label" id="label">Choisissez une destination</span>
        <button type="button" id="next">Suivant →</button>
    </div>
</div>

<script type="module">
    import {LinkPlayer} from "../src/LinkPlayer.js";
    import {bindView} from "../src/bindView.js";

    const TARGET = "footage-gp1";
    const LOREM = "Lorem ipsum dolor sit amet, consectetur adipiscing elit…";

    const createDestination = ({shortTitle, videoId, description, link, startSeconds}) => ({
        key: shortTitle.toLowerCase(),
        provider: "youtube",
        // target: TARGET,
        shortTitle,
        videoId,
        start: startSeconds,
        autoplay: "click",
        extra: {
            description: description || LOREM,
            link: link || {href: `https://example.com/${shortTitle}`, text: `Guide de ${shortTitle}`}
        }
    });

    const DESTINATIONS = [
        createDestination({
            shortTitle: "Bahamas",
            videoId: "YCfcg9gzCYc",
            startSeconds: 2712,
            description: "Un archipel de plus de 700 îles : eaux turquoise…"
        }),
        createDestination({shortTitle: "Maldives", videoId: "69iUWLA0oVc"}),
        createDestination({shortTitle: "Tahiti", videoId: "5drmgVauSMg"}),
        createDestination({shortTitle: "Vietnam", videoId: "k8m0SaGQ_1c"}),
    ];

    const lp = new LinkPlayer({
        autoScan: false,
        tooltip: false,
        defaultTarget: TARGET,
        currentBehavior: "skip",
        boundaryBehavior: "loop",
        definitions: DESTINATIONS,
        youtubeApiKey: "AIzaSyDGgMOJkyudMYOyKRoTqbFVpcTLJKvOk4M",
        youtubeMetaScope: "all",
        youtubeMetaRequired: ["title", "description", "channel", "channelUrl"]
    });

    const region = lp.getRegion(TARGET);

    const detailsSection = document.getElementById('details');
    const toggleBtn = detailsSection.querySelector('.details-toggle');

    // Écouteur de clic sur le bouton "Afficher plus / Moins"
    toggleBtn.addEventListener('click', () => {
        const isCollapsed = detailsSection.classList.contains('is-collapsed');

        if (isCollapsed) {
            detailsSection.classList.remove('is-collapsed');
            detailsSection.classList.add('is-expanded');
            toggleBtn.textContent = "Moins";
        } else {
            detailsSection.classList.remove('is-expanded');
            detailsSection.classList.add('is-collapsed');
            toggleBtn.textContent = "Afficher plus";
        }
    });

    // Dependent view
    bindView(region, "#details", (el, {info, params}) => {
        console.log("bindView", info, params);
        el.hidden = false;
        const extra = info?.extra;
        if (!extra) {
            el.hidden = true;
            return;
        }
        el.querySelector("h2").textContent = info.title ?? "";

        const noEmoji = (s) => s.replace(/[\p{Emoji_Presentation}\p{Emoji_Modifier}\uFE0F\u200D]/gu, "");
        let rawText = info.description ?? extra.description ?? "";
        el.querySelector("p").textContent = noEmoji(rawText);

        if (params?.from) el.querySelector("small").textContent = params.from.toUpperCase();

        const a = el.querySelector("a");
        a.href = extra.link?.href ?? "#";
        a.textContent = extra.link?.text ?? "";
        el.hidden = false;
        el.classList.remove('is-expanded');
        el.classList.add('is-collapsed');
        toggleBtn.textContent = "Afficher plus";
    });

    // UI
    const label = document.getElementById("label");
    const prev = document.getElementById("prev");
    const next = document.getElementById("next");
    const grid = document.getElementById("destinations");

    const currentIndex = () =>
        DESTINATIONS.findIndex(({key}) => region.get(key) === region.current);

    function go(key, from) {
        if (region.get(key) === region.current) return;
        region.navigate(key, {autoplay: true, params: {from}});
    }

    for (const d of DESTINATIONS) {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "dest";
        btn.dataset.dest = d.key;
        btn.innerHTML = `<img src="https://img.youtube.com/vi/${d.videoId}/mqdefault.jpg" alt="" loading="lazy"><span></span>`;
        btn.querySelector("span").textContent = d.shortTitle;
        btn.addEventListener("click", () => go(d.key, "la grille"));
        grid.append(btn);
    }

    prev.addEventListener("click", () => region.previousInfo());
    next.addEventListener("click", () => region.nextInfo());
    prev.disabled = next.disabled = DESTINATIONS.length < 2;

    function render() {
        const i = currentIndex();
        for (const btn of grid.children) {
            const active = btn.dataset.dest === DESTINATIONS[i]?.key;
            btn.classList.toggle("is-playing", active);
            active ? btn.setAttribute("aria-current", "true") : btn.removeAttribute("aria-current");
        }
        label.textContent = i >= 0
            ? `${DESTINATIONS[i].shortTitle} · ${i + 1} / ${DESTINATIONS.length}`
            : "Choisissez une destination";
    }

    lp.on("change", render);
    lp.on("error", ({error}) => console.warn("[code-only]", error));

    lp.scan();
    if (!region.current) region.navigate(DESTINATIONS[0].key);
</script>
</body>
</html>
