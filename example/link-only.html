<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>LinkPlayer – Link only</title>
    <style>
        :root { --ink:#6b4f27; --gold:#f0b95a; --line:#f1eadb; }
        body { margin:0; padding:24px 12px; font-family:"Segoe UI",system-ui,sans-serif; color:var(--ink); background:#fffdf9; }
        .wrap { max-width:1100px; margin:0 auto; }
        h1 { font:italic 600 1.8rem Georgia,serif; margin:0 0 8px; }
        .hint { color:#a97a2a; margin-bottom:20px; }
        .video-container {
            position:relative; width:100%; aspect-ratio:16/9; overflow:hidden;
            border-radius:20px; background:#f6f2ea; border:5px solid #fff;
            box-shadow:0 18px 44px rgba(120,100,60,.22),0 0 0 1px var(--line);
        }
        .video-container iframe { position:absolute; inset:0; width:100%; height:100%; border:0; }
        .links { display:flex; flex-wrap:wrap; gap:10px; margin-top:18px; }
        .links a {
            display:inline-block; padding:10px 16px; border-radius:999px;
            background:#fffaf0; border:1px solid #f1e4c4; color:#a97a2a;
            text-decoration:none; font-weight:600; font-size:.85rem;
        }
        .links a:hover { background:#f0b95a; color:#fff; }
        .section { margin-top:28px; }
        .section h2 { font:italic 600 1.3rem Georgia,serif; margin:0 0 10px; }
    </style>
</head>
<body>
<div class="wrap">
    <h1>Link only</h1>
    <p class="hint">Toutes les infos viennent des attributs <code>data-*</code>. Un seul player global.</p>

    <div id="player-main" class="video-container"></div>

    <div class="section">
        <h2>YouTube</h2>
        <div class="links">
            <!-- Vidéo simple + start + autoplay au clic -->
            <a data-link
               href="https://www.youtube.com/watch?v=z2sv_RsNwM4&t=2712s"
               data-target="player-main"
               data-autoplay="click"
               data-title="Bahamas"
               data-channel="Me"
               data-thumbnail="https://i.ytimg.com/vi/z2sv_RsNwM4/mqdefault.jpg">
                Single Video (start 45:12)
            </a>

            <!-- Liste de vidéos + index -->
            <a data-link
               href="https://www.youtube.com/watch_videos?video_ids=z2sv_RsNwM4,-xiF9YIIUk4&index=2"
               data-target="player-main"
               data-title="Trip"
               data-items='[{"title":"ASMR"},{"title":"Trains","channel":"Me"}]'>
                Video List (index=2)
            </a>

            <!-- Playlist avec vidéo de départ -->
            <a data-link
               href="https://www.youtube.com/watch?v=s11CNT_hQTg&list=PLYALQE76y6LQ"
               data-target="player-main"
               data-channel="Retime Clips"
               data-items='[
           {"id":"s11CNT_hQTg","title":"V (1983) – L’arrivée des Visiteurs"},
           {"id":"C_dEl2cMCEA","title":"V (1983) – Diana propose son expérience"}
         ]'>
                Playlist (start video ≠ first)
            </a>

            <!-- Playlist sans videoId de départ
            <a data-link
               href="https://www.youtube.com/?list=PLYALQE76y6LQ"
               data-target="player-main"
               data-title="Playlist pure"
               data-channel="Retime Clips">
                Playlist (sans videoId)
            </a>-->
        </div>
    </div>

    <div class="section">
        <h2>OK.ru</h2>
        <div class="links">
            <a data-link
               href="https://ok.ru/video/17222095800962"
               data-target="player-main"
               data-title="MacGyver S03E08 VF | Accident en Haute Montagne"
               data-channel="Retime Clips Okru">
                Video okru simple
            </a>

            <!-- Ancienne version : video_ids + labels dans l’URL -->
            <a data-link
               href="https://ok.ru/video/3953767680692?video_ids=3953767680692,3953767877300,3953768270516,3953768532660,3953768860340,3953768991412,3953769188020,3953769384628,3953769712308,3953770105524&labels=La%20Caverne%20de%20la%20Rose%20d'Or%2C%20%C3%A9p.01%20-%20BluRay%20720p%20VF,La%20Caverne%20de%20la%20Rose%20d'Or%2C%20%C3%A9p.02%20-%20BluRay%20720p%20VF,La%20Caverne%20de%20la%20Rose%20d'Or%2C%20%C3%A9p.03%20-%20BluRay%20720p%20VF,La%20Caverne%20de%20la%20Rose%20d'Or%2C%20%C3%A9p.04%20-%20BluRay%20720p%20VF,La%20Caverne%20de%20la%20Rose%20d'Or%2C%20%C3%A9p.05%20-%20BluRay%20720p%20VF,La%20Caverne%20de%20la%20Rose%20d'Or%2C%20%C3%A9p.06%20-%20BluRay%20720p%20VF,La%20Caverne%20de%20la%20Rose%20d'Or%2C%20%C3%A9p.07%20-%20BluRay%20720p%20VF,La%20Caverne%20de%20la%20Rose%20d'Or%2C%20%C3%A9p.08%20-%20BluRay%20720p%20VF,La%20Caverne%20de%20la%20Rose%20d'Or%2C%20%C3%A9p.09%20-%20BluRay%20720p%20VF,La%20Caverne%20de%20la%20Rose%20d'Or%2C%20%C3%A9p.010%20-%20BluRay%20720p%20VF"
               data-target="player-main">
                Old okru version (video_ids + labels)
            </a>
        </div>
    </div>
</div>

<script type="module">
    import { LinkPlayer } from "../src/LinkPlayer.js";

    const okruEmbedBaseUrl = "https://okru-embed.vercel.app/";
    // Player global (tout le document)
    const lp = new LinkPlayer({
        useStorage: true,
        currentBehavior: "toggle",   // ou "skip"
        youtubeApiKey: "AIzaSyDGgMOJkyudMYOyKRoTqbFVpcTLJKvOk4M",
        fallbackTitle: (i) => `Vidéo ${i + 1}`,
    });
</script>
</body>
</html>
