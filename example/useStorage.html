<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>LinkPlayer : page d'exemples mixtes</title>
    <style>
        :root {
            color-scheme: light dark;
            --bg: #f5f6f8;
            --card: #ffffff;
            --ink: #1a1f26;
            --muted: #5a6572;
            --line: #dbe0e6;
            --accent: #c2410c;
            --accent-ink: #ffffff;
            --chip-yt: #b91c1c;
            --chip-ok: #b45309;
            --ok: #15803d;
            --err: #b91c1c;
            --warn: #a16207;
            --code: #eef0f3;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0e1217;
                --card: #161b22;
                --ink: #e6eaef;
                --muted: #98a3b0;
                --line: #29313b;
                --accent: #fb923c;
                --accent-ink: #1a1208;
                --chip-yt: #f87171;
                --chip-ok: #fbbf24;
                --ok: #4ade80;
                --err: #f87171;
                --warn: #facc15;
                --code: #1f262f;
            }
        }

        * {
            box-sizing: border-box;
        }

        [hidden] {
            display: none !important;
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--ink);
            font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
        }

        .layout {
            max-width: 800px;
            margin: 0 auto;
            padding: 24px 16px 80px;
        }

        @media (max-width: 1000px) {
            .layout {
                grid-template-columns: 1fr;
            }

            aside {
                position: static !important;
                max-height: none !important;
            }
        }

        header h1 {
            margin: 0 0 4px;
            font-size: 1.6rem;
        }

        header p, .what, .note {
            color: var(--muted);
            margin: 6px 0 12px;
        }

        code, pre {
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            font-size: .86em;
        }

        code {
            background: var(--code);
            padding: 1px 5px;
            border-radius: 4px;
        }

        pre {
            background: var(--code);
            padding: 10px 12px;
            border-radius: 8px;
            overflow: auto;
            margin: 8px 0 12px;
        }

        nav.toc {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin: 12px 0 20px;
        }

        nav.toc a {
            padding: 4px 10px;
            border: 1px solid var(--line);
            border-radius: 999px;
            text-decoration: none;
            color: var(--ink);
            background: var(--card);
            font-size: .9rem;
        }

        section.sec {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 18px 20px;
            margin: 0 0 22px;
        }

        section.sec > h2 {
            margin: 0 0 2px;
            font-size: 1.2rem;
        }

        h3 {
            margin: 18px 0 4px;
            font-size: 1rem;
        }

        .links {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin: 8px 0;
        }

        .links a, button {
            font: inherit;
            font-size: .92rem;
            padding: 6px 12px;
            border-radius: 8px;
            border: 1px solid var(--line);
            background: var(--card);
            color: var(--ink);
            cursor: pointer;
            text-decoration: none;
        }

        .links a:hover, button:hover:not(:disabled) {
            border-color: var(--accent);
        }

        button:disabled {
            opacity: .4;
            cursor: not-allowed;
        }

        button.primary {
            background: var(--accent);
            color: var(--accent-ink);
            border-color: var(--accent);
        }

        .chip {
            display: inline-block;
            font-size: .68rem;
            font-weight: 700;
            letter-spacing: .03em;
            padding: 1px 6px;
            border-radius: 4px;
            margin-right: 6px;
            color: #fff;
            vertical-align: 1px;
        }

        .chip.yt {
            background: var(--chip-yt);
        }

        .chip.ok {
            background: var(--chip-ok);
        }

        .player-zone {
            min-height: 72px;
            border: 1px dashed var(--line);
            border-radius: 10px;
            padding: 8px;
            margin: 10px 0 6px;
        }

        .player-zone:empty::before {
            content: "zone cible : rien d'affiché pour l'instant";
            color: var(--muted);
            font-size: .85rem;
        }

        .player-zone iframe {
            display: block;
            width: 100%;
            height: auto;
            aspect-ratio: 16 / 9;
            border: 0;
            border-radius: 8px;
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 6px;
            margin: 6px 0 4px;
        }

        .controls .sep {
            width: 1px;
            align-self: stretch;
            background: var(--line);
            margin: 0 4px;
        }

        .status {
            font-size: .82rem;
            color: var(--muted);
            margin-left: auto;
        }

        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        @media (max-width: 700px) {
            .row {
                grid-template-columns: 1fr;
            }
        }

        .tag {
            font-size: .75rem;
            font-weight: 600;
            padding: 2px 8px;
            border-radius: 999px;
            border: 1px solid var(--line);
            color: var(--muted);
        }

        .details {
            border-left: 3px solid var(--accent);
            padding: 4px 12px;
            margin: 10px 0;
            min-height: 3.2em;
        }

        .details strong {
            display: block;
        }

        .warn {
            color: var(--warn);
        }

        aside {
            position: sticky;
            top: 16px;
            align-self: start;
            max-height: calc(100vh - 32px);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        aside .box {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 12px 14px;
        }

        aside h2 {
            margin: 0 0 8px;
            font-size: 1rem;
        }

        aside input {
            width: 100%;
            font: inherit;
            font-size: .85rem;
            padding: 6px 8px;
            border-radius: 6px;
            border: 1px solid var(--line);
            background: var(--bg);
            color: var(--ink);
            margin-bottom: 6px;
        }

        #log {
            list-style: none;
            margin: 0;
            padding: 0;
            overflow: auto;
            max-height: 46vh;
            font-size: .78rem;
            font-family: ui-monospace, monospace;
        }

        #log li {
            padding: 3px 0;
            border-bottom: 1px solid var(--line);
            word-break: break-word;
        }

        #log .who {
            color: var(--muted);
        }

        #log .t-change {
            color: var(--ok);
        }

        #log .t-state {
            color: var(--accent);
        }

        #log .t-error {
            color: var(--err);
            font-weight: 600;
        }

        a[data-link].is-active {
            border-color: #f7931e;
        }
    </style>
</head>
<body>

</html>
